<div class="container cart-container">
  <h2 class="mb-4">Shopping Cart</h2>

  <div class="table-responsive">
    <table class="table table-bordered">
      <thead class="thead-light">
        <tr>
          <th scope="col">Product</th>
          <th scope="col">Name</th>
          <th scope="col">Price</th>
          <th scope="col">Quantity</th>
          <th scope="col">Subtotal</th>
          <th scope="col">Remove</th>
        </tr>
      </thead>
      <tbody id="cart-items">
        <tr>
          <td>
            <img
              src="https://krstoreapi.phalla.lol/images/products/1.png"
              class="cart-img"
              alt="Product"
            />
          </td>
          <td>Product 1</td>
          <td>$50.00</td>
          <td><input type="number" class="form-control qty-input" value="1" min="1" /></td>
          <td>$50.00</td>
          <td>
            <button class="remove-btn"><i class="fas fa-trash-alt"></i></button>
          </td>
        </tr>
        <tr>
          <td>
            <img
              src="https://krstoreapi.phalla.lol/images/products/1.png"
              class="cart-img"
              alt="Product"
            />
          </td>
          <td>Product 2</td>
          <td>$30.00</td>
          <td><input type="number" class="form-control qty-input" value="2" min="1" /></td>
          <td>$60.00</td>
          <td>
            <button class="remove-btn"><i class="fas fa-trash-alt"></i></button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Total & Checkout -->
  <div class="d-flex justify-content-between align-items-center mt-4 flex-column flex-md-row">
    <div class="cart-total mb-3 mb-md-0">Total: $110.00</div>
    <button class="btn btn-checkout btn-lg">Checkout</button>
  </div>
</div>

<!-- Bootstrap 4 JS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
  const cartItems = document.querySelectorAll('#cart-items tr');

  function updateTotals() {
    let total = 0;
    cartItems.forEach((row) => {
      const price = parseFloat(row.cells[2].innerText.replace('$', ''));
      const qty = parseInt(row.cells[3].querySelector('input').value);
      const subtotal = price * qty;
      row.cells[4].innerText = `$${subtotal.toFixed(2)}`;
      total += subtotal;
    });
    document.querySelector('.cart-total').innerText = `Total: $${total.toFixed(2)}`;
  }

  cartItems.forEach((row) => {
    row.cells[3].querySelector('input').addEventListener('change', updateTotals);
    row.cells[5].querySelector('button').addEventListener('click', () => {
      row.remove();
      updateTotals();
    });
  });

  updateTotals();
</script>
